apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-web-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/aegis-jkn/infra.git'
    targetRevision: HEAD
    path: charts/web
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: aegis-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
