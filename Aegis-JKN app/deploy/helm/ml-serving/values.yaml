replicaCount: 2

image:
  repository: aegis-jkn/ml-serving
  pullPolicy: IfNotPresent
  tag: "latest"

resources:
  limits:
    nvidia.com/gpu: 1
    cpu: 4
    memory: 16Gi
  requests:
    nvidia.com/gpu: 1
    cpu: 2
    memory: 8Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
