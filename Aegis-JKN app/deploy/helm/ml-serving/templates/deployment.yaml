apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis-ml.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegis-ml.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis-ml.selectorLabels" . | nindent 8 }}
    spec:
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - containerPort: 8000
