apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis-workers.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegis-workers.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis-workers.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
