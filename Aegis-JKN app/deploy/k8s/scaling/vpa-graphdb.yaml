apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: graphdb-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: falkordb
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "falkordb"
        minAllowed:
          cpu: "500m"
          memory: "2Gi"
        maxAllowed:
          cpu: "4"
          memory: "32Gi"
