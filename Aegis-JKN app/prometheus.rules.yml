groups:
  - name: api_red_metrics
    rules:
      # 1. Rate: Requests per second
      - record: job:http_requests_total:rate5m
        expr: sum by (job, endpoint) (rate(http_requests_total[5m]))

      # 2. Errors: Error rate percentage
      - record: job:http_errors_total:rate5m
        expr: sum by (job, endpoint) (rate(http_requests_total{status=~"5.."}[5m])) / sum by (job, endpoint) (rate(http_requests_total[5m])) * 100

      # 3. Duration: p95 Latency
      - record: job:http_request_duration_seconds:p95
        expr: histogram_quantile(0.95, sum by (le, job, endpoint) (rate(http_request_duration_seconds_bucket[5m])))

  - name: gpu_alerts
    rules:
      - alert: HighGPUUtilization
        expr: nvidia_gpu_utilization > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU utilization is too high on {{ $labels.instance }}"
          description: "GPU utilization has been above 90% for 5 minutes."

      - alert: GPUMemoryCritical
        expr: nvidia_gpu_memory_used_bytes / nvidia_gpu_memory_total_bytes > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GPU Memory nearly full on {{ $labels.instance }}"
          description: "GPU Memory usage is above 95%."
